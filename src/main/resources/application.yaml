spring:
  application:
    name: productcatalog

  datasource:
    url: jdbc:mysql://localhost:3306/product_catalog
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: 1234567890123456789012345678901234567890123456789012345678901234
    expiration-ms: 86400000
